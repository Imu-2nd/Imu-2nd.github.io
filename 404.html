<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>길을 잃었어요 — 아롱이</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" />
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: linear-gradient(180deg, #a9dcf7, #ffe7c6);
      color: #3c332a;
      font-family: "Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    h1 { font-size: clamp(40px, 9vw, 76px); margin: 0 0 8px; }
    p { font-size: clamp(20px, 4vw, 26px); margin: 0 0 28px; color: #4a4038; }
    a {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 999px;
      background: #ff9a63;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(120, 92, 62, .2);
    }
    .paw { font-size: 54px; }
  </style>
</head>
<body>
  <main>
    <p class="paw">🐾</p>
    <h1>여긴 아무것도 없네</h1>
    <p>아롱이가 발자국만 남기고 어디론가 갔나 봐요.</p>
    <a href="/">강아지별로 돌아가기</a>
  </main>
</body>
</html>
